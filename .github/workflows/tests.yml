name: Tests

on:
  push:
    branches:
      - main
      - gui
  pull_request:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4, 8.5]

    name: PHP ${{ matrix.php }} (SQLite)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test

  mysql:
    runs-on: ubuntu-latest

    name: PHP 8.3 (MySQL 8.0, igual à VPS)

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: planossf_test
          MYSQL_USER: planossf
          MYSQL_PASSWORD: planossf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: planossf_test
          DB_USERNAME: planossf
          DB_PASSWORD: planossf
        run: php artisan test

      - name: Create the application user (deploy/app-grants.sh)
        env:
          PLANOS_DB: planossf_test
          PLANOS_APP_HOST: '%'
          MYSQL: mysql -h 127.0.0.1 -uroot -proot
        run: |
          $MYSQL -e "CREATE USER 'planossf_app'@'%' IDENTIFIED BY 'planossf_app'"
          bash deploy/app-grants.sh

      - name: Application user permissions
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: planossf_test
          DB_USERNAME: planossf_app
          DB_PASSWORD: planossf_app
          PLANOS_CHECK_APP_GRANTS: 1
        run: |
          php artisan test --filter=AppDatabaseUserTest | tee app-user.txt
          sed 's/\x1b\[[0-9;]*m//g' app-user.txt | grep -Eq "Tests: +3 passed"

      - name: Control - the same test fails with the database owner
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: planossf_test
          DB_USERNAME: planossf
          DB_PASSWORD: planossf
          PLANOS_CHECK_APP_GRANTS: 1
        run: |
          if php artisan test --filter=AppDatabaseUserTest > control.txt 2>&1; then
            cat control.txt
            echo "Passou com o dono do banco: o teste não distingue as permissões."
            exit 1
          fi
          cat control.txt
          sed 's/\x1b\[[0-9;]*m//g' control.txt | grep -q "deveria ser negado"

  assets:
    runs-on: ubuntu-latest

    name: Build dos assets (Vite)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
